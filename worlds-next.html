<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>STARBEAM</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Geologica:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{--deep:#070B24;--gold:#CDA349;--gold-soft:rgba(205,163,73,.42);--star:#EEF0FF;--haze:#9AA3C7;--dim:#5E6694;--beam:#FF6A3D;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Geologica',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:var(--star);font-family:var(--sans);font-size:17px;line-height:1.5;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:56px}
.wordmark{font-family:var(--serif);font-weight:600;letter-spacing:.22em;font-size:20px;color:var(--star);text-decoration:none}
.top a.back{color:var(--haze);text-decoration:none;font-size:15px}.top a.back:hover{color:#fff}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(38px,6vw,60px);line-height:1.05;margin-bottom:14px}
.sub{color:var(--haze);font-size:18px;margin-bottom:12px}
.switch{font-size:16px;color:var(--haze);margin-bottom:34px}.switch a{color:var(--beam)}
table{width:100%;border-collapse:collapse;font-size:16px}
th{text-align:left;font-weight:400;color:var(--dim);font-size:14px;padding:10px 8px;border-bottom:1px solid var(--gold-soft)}
td{padding:11px 8px;border-bottom:1px solid rgba(205,163,73,.14)}
.r{text-align:right}.img a{color:var(--haze);white-space:nowrap;font-size:14px}.img a:hover{color:#fff}.img a.ph{color:var(--gold);margin-right:8px}.note{color:var(--dim);font-size:14px;margin-top:20px}.yr{color:var(--beam)}.next .yr{color:var(--haze)}.muted{color:var(--haze)}
@media (max-width:560px){.hide-s{display:none}table{font-size:15px}}
/* ===== пульт навигации, как панель управления кораблём ===== */
.console{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:flex;gap:5px;padding:6px;background:rgba(5,8,24,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--gold-soft);border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06)}
.console a{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:76px;padding:10px 10px 8px;border-radius:10px;color:var(--haze);text-decoration:none;font-size:13px;letter-spacing:.03em;background:linear-gradient(#0d1233,#070a1f);border:1px solid rgba(205,163,73,.16);cursor:pointer;transition:color .15s,border-color .15s,box-shadow .15s}
.console svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round}
.console a::before{content:'';position:absolute;top:6px;right:7px;width:5px;height:5px;border-radius:50%;background:#262b48;transition:background .15s,box-shadow .15s}
.console a:hover{color:#fff;border-color:var(--gold-soft)}
.console a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.console a.on{color:#fff;border-color:var(--beam);box-shadow:0 0 16px rgba(255,106,61,.32),inset 0 0 14px rgba(255,106,61,.14)}
.console a.on::before{background:var(--beam);box-shadow:0 0 8px var(--beam)}
body{padding-bottom:96px}
@media (max-width:700px){
  .console{left:0;right:0;bottom:0;transform:none;border-radius:16px 16px 0 0;border-bottom:0;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .console a{min-width:0;flex:1;padding:9px 2px 7px;font-size:11px}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
}

</style>
</head>
<body class="next">
<nav class="console" aria-label="Разделы" data-i18n-aria="aNav">
  <a data-go="home"><svg viewBox="0 0 24 24"><path d="M5.5 18.5 19 5"/><circle cx="19.5" cy="4.5" r="2"/><circle cx="5" cy="19" r="3"/></svg><span data-i18n="cBeam">Луч</span></a>
  <a data-go="id"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="8.5" cy="12" r="2.2"/><path d="M13 10h5M13 14h4"/></svg><span>ID</span></a>
  <a data-go="sky"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="1.5"/></svg><span data-i18n="cSky">Небо</span></a>
  <a data-go="chronicle"><svg viewBox="0 0 24 24"><path d="M2 12h20"/><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/></svg><span data-i18n="cRoute">Хроника</span></a>
  <a data-go="worlds"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="10.5" ry="3.6" transform="rotate(-20 12 12)"/></svg><span data-i18n="cWorlds">Миры</span></a>
  <a data-go="scope"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></svg><span data-i18n="cScope">Окуляр</span></a>
</nav>
<div class="wrap">
  <div class="top"><a class="wordmark" id="home" href="/">STARBEAM</a><a class="back" id="back" href="/"></a></div>
  <h1 id="h"></h1>
  <p class="sub" id="sub"></p>
  <p class="switch"><a id="other" href="#"></a></p>
  <div id="list"><p class="muted">…</p></div>
  <p class="note" id="note"></p>
</div>
<script>
const MODE = 'next', SEC_YR = 31557600;
const EXO_FALLBACK = [
  ['Proxima Cen b',217.429,-62.680,4.246,2016],['Proxima Cen d',217.429,-62.680,4.246,2022],['Barnard b',269.452,4.693,5.96,2024],
  ['Lalande 21185 b',165.836,35.970,8.31,2019],['eps Eri b',53.233,-9.458,10.47,2000],['Ross 128 b',176.937,0.800,11.0,2017],
  ['GJ 1061 d',53.999,-44.512,12.0,2019],['Teegarden\'s Star b',43.254,16.881,12.5,2019],['Teegarden\'s Star c',43.254,16.881,12.5,2019],
  ['Wolf 1061 c',247.575,-12.663,14.0,2015],['Gliese 876 b',343.320,-14.264,15.2,1998],['GJ 682 b',260.982,-44.319,16.3,2014],
  ['Gliese 581 c',229.862,-7.722,20.5,2007],['Gliese 667 C c',259.746,-34.997,23.6,2013],['HD 219134 b',348.321,57.168,21.3,2015],
  ['TRAPPIST-1 e',346.622,-5.041,40.7,2017],['TRAPPIST-1 f',346.622,-5.041,40.7,2017],['55 Cnc e',133.149,28.330,41.0,2004],
  ['LHS 1140 b',11.247,-15.272,48.8,2017],['51 Peg b',344.367,20.769,50.6,1995],['HD 189733 b',300.182,22.711,64.5,2005],
  ['HD 209458 b',330.795,18.884,159,1999]
].map(([n,ra,dec,ly,y]) => ({ name:n, ra, dec, ly, year:y }));
const L = {
  ru: { reached: 'Достигнутые миры', next: 'Следующие миры', subR: 'Экзопланеты, до которых уже дошёл свет твоего рождения: {n}.', subN: 'Экзопланеты, до которых твой свет дойдёт дальше.', otherR: 'Смотреть следующие', otherN: 'Смотреть достигнутые', back: '← На главную', planet: 'Планета', found: 'Открыта', dist: 'Расстояние', lightR: 'Свет дошёл', lightN: 'Свет дойдёт', ly: 'св. л.', none: 'Пока пусто: твой свет ещё не дошёл до ближайшего известного мира.', img: 'Изображение', photo: 'снимок', eyes: '3D NASA', imgNote: 'Настоящие снимки есть только у планет, сфотографированных напрямую. У остальных — 3D‑визуализация NASA Eyes on Exoplanets.', noDate: 'Укажи дату рождения на главной странице.' },
  en: { reached: 'Worlds reached', next: 'Next worlds', subR: 'Exoplanets the light of your birth has already reached: {n}.', subN: 'Exoplanets your light will reach next.', otherR: 'See the next ones', otherN: 'See the reached ones', back: '← Back to STARBEAM', planet: 'Planet', found: 'Found', dist: 'Distance', lightR: 'Light arrived', lightN: 'Light arrives', ly: 'ly', none: 'Nothing yet: your light has not reached the nearest known world.', img: 'Image', photo: 'photo', eyes: 'NASA 3D', imgNote: 'Real photos exist only for directly imaged planets. The rest link to the NASA Eyes on Exoplanets 3D view.', noDate: 'Set your birth date on the main page.' },
  es: { reached: 'Mundos alcanzados', next: 'Próximos mundos', subR: 'Exoplanetas a los que ya llegó la luz de tu nacimiento: {n}.', subN: 'Exoplanetas a los que tu luz llegará después.', otherR: 'Ver los próximos', otherN: 'Ver los alcanzados', back: '← Volver a STARBEAM', planet: 'Planeta', found: 'Descubierto', dist: 'Distancia', lightR: 'Llegó la luz', lightN: 'Llegará la luz', ly: 'a. l.', none: 'Todavía nada: tu luz no llegó al mundo conocido más cercano.', img: 'Imagen', photo: 'foto', eyes: '3D NASA', imgNote: 'Solo hay fotos reales de los planetas captados en imagen directa. El resto enlaza a la vista 3D de NASA Eyes on Exoplanets.', noDate: 'Indicá tu fecha de nacimiento en la página principal.' },
};
let saved = {}; try { saved = JSON.parse(localStorage.getItem('sb_state')) || {}; } catch {}
let savedLang = null; try { savedLang = localStorage.getItem('sb_lang'); } catch {}
const qs = new URLSearchParams(location.search), LANG = L[qs.get('lang')] ? qs.get('lang') : L[savedLang] ? savedLang : 'ru', t = L[LANG], b = Number(qs.get('b')) || Number(saved.birthMs);
const NAV = { ru: ['Луч', 'Небо', 'Хроника', 'Миры', 'Окуляр'], en: ['Beam', 'Sky', 'Chronicle', 'Worlds', 'Eyepiece'], es: ['Haz', 'Cielo', 'Crónica', 'Mundos', 'Ocular'] }[LANG];
{ const home0 = LANG === 'ru' ? '/' : '/' + LANG, q = '?lang=' + LANG;
  const go = { home: home0, id: home0 + '#passport', sky: '/sky.html' + q, chronicle: '/chronicle.html' + q, worlds: '/worlds-reached.html' + q + (b ? '&b=' + b : ''), scope: '/scope.html' + q };
  const names = { home: NAV[0], sky: NAV[1], chronicle: NAV[2], worlds: NAV[3], scope: NAV[4] };
  document.querySelectorAll('.console a').forEach((a) => { a.href = go[a.dataset.go]; a.classList.toggle('on', a.dataset.go === 'worlds'); const sp = a.querySelector('span'); if (names[a.dataset.go]) sp.textContent = names[a.dataset.go]; }); }
document.documentElement.lang = LANG;
const home = LANG === 'ru' ? '/' : '/' + LANG;
document.getElementById('home').href = home; const back = document.getElementById('back'); back.href = home; back.textContent = t.back;
const h = MODE === 'reached' ? t.reached : t.next; document.getElementById('h').textContent = h; document.title = h + ' — STARBEAM';
const other = document.getElementById('other'); other.textContent = MODE === 'reached' ? t.otherR : t.otherN;
other.href = (MODE === 'reached' ? '/worlds-next.html' : '/worlds-reached.html') + location.search;
const PHOTOS = {
  epsindab: 'https://www.esa.int/ESA_Multimedia/Images/2024/07/Exoplanet_Epsilon_Indi_Ab_MIRI_image',
  aflepb: 'https://eso.org/public/images/potw2308a/',
  '51erib': 'https://science.nasa.gov/asset/webb/exoplanet-51-eridani-b-gemini',
  betpicb: 'https://www.eso.org/public/images/eso1024c/',
  twa7b: 'https://www.esa.int/ESA_Multimedia/Images/2025/06/High-contrast_coronograph_image_of_TWA_7b',
};
const key = (n) => n.toLowerCase().replace(/[^a-z0-9]/g, '');
const eyes = (n) => 'https://eyes.nasa.gov/apps/exo/#/planet/' + encodeURIComponent(n.replace(/ /g, '_'));
const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const loc = { ru: 'ru-RU', en: 'en-US', es: 'es-AR' }[LANG], nf = new Intl.NumberFormat(loc, { maximumFractionDigits: 1 });
// полный каталог NASA Exoplanet Archive (≤ 110 св. лет) лежит на сайте: архив не отдаёт данные браузерам с других сайтов
async function load() {
  try { const r = await fetch('/exo.json'); if (!r.ok) throw 0; return (await r.json()).map(([name, ly, , , year]) => ({ name, ly, year })); }
  catch { return EXO_FALLBACK.slice(); }
}
(async () => {
  const list = document.getElementById('list');
  if (!b) { list.innerHTML = `<p class="muted">${t.noDate}</p>`; return; }
  const ageLy = (Date.now() - b) / (SEC_YR * 1000);
  const all = (await load()).sort((a, c) => a.ly - c.ly);
  const rows = MODE === 'reached' ? all.filter((p) => p.ly <= ageLy).reverse() : all.filter((p) => p.ly > ageLy);
  document.getElementById('sub').textContent = MODE === 'reached' ? t.subR.replace('{n}', rows.length) : t.subN;
  document.getElementById('note').textContent = t.imgNote;
  list.innerHTML = rows.length ? `<table><thead><tr><th>${t.planet}</th><th class="hide-s">${t.found}</th><th class="r">${t.dist}</th><th class="r">${MODE === 'reached' ? t.lightR : t.lightN}</th><th class="r">${t.img}</th></tr></thead><tbody>${rows.map((p) => `<tr><td>${esc(p.name)}</td><td class="hide-s muted">${esc(p.year || '—')}</td><td class="r">${nf.format(p.ly)} ${t.ly}</td><td class="r yr">${new Date(b + p.ly * SEC_YR * 1000).getFullYear()}</td><td class="r img">${PHOTOS[key(p.name)] ? `<a class="ph" href="${PHOTOS[key(p.name)]}" target="_blank" rel="noopener">${t.photo}</a> ` : ''}<a href="${eyes(p.name)}" target="_blank" rel="noopener">${t.eyes}</a></td></tr>`).join('')}</tbody></table>` : `<p class="muted">${t.none}</p>`;
})();
</script>
</body>
</html>
